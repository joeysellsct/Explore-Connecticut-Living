name: Milford primary-source watch

# Read-only monitoring. Never auto-publish facts just because a URL responds
# or an upstream dataset changes. Verified EN/ES updates need a separate gate.
on:
  schedule:
    - cron: '41 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recheck Milford source reachability and state tax-data candidates
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync, mkdirSync, writeFileSync} from 'node:fs';
          const now = new Date().toISOString();
          const sourceBlock = (filename) => {
            const src = readFileSync(filename, 'utf8');
            const start = src.indexOf("'milford': [");
            if (start < 0) throw new Error('Milford source block missing in ' + filename);
            const end = src.indexOf('\n ],', start);
            if (end < 0) throw new Error('Milford source block terminator missing in ' + filename);
            return src.slice(start, end);
          };
          const extract = (block, field) => [...block.matchAll(new RegExp('\\b' + field + ':"(https:[^"]+)"', 'g'))].map(m => m[1]);
          const municipal = extract(sourceBlock('lib/town-official-links.ts'), 'url');
          const restaurants = extract(sourceBlock('lib/town-restaurants.ts'), 'sourceUrl');
          if (municipal.length < 10 || restaurants.length !== 5) {
            throw new Error('Unexpected Milford source count: ' + municipal.length + ' municipal, ' + restaurants.length + ' restaurants');
          }
          const targets = [...new Set([...municipal, ...restaurants])];
          const report = {checkedAt: now, town: 'Milford', mode: 'READ_ONLY_NOT_AUTOMATIC_PUBLICATION', targets: targets.length, links: [], taxData: {}};
          const check = async (url) => {
            try {
              const response = await fetch(url, {redirect:'follow', signal:AbortSignal.timeout(14000),
                headers:{'user-agent':'ExploreConnecticutLiving-SourceWatch/1.0'}});
              const status = response.status;
              await response.body?.cancel();
              return {url, status, result: status === 404 || status === 410 ? 'REVIEW_POSSIBLE_DEAD_LINK'
                : status >= 200 && status < 400 ? 'REACHABLE_NOT_FACT_VERIFIED' : 'INCONCLUSIVE'};
            } catch (error) {
              return {url, status:null, result:'INCONCLUSIVE', error:String(error.message).slice(0,180)};
            }
          };
          let index = 0;
          const workers = Array.from({length:4}, async () => {
            while (index < targets.length) {
              const current = index++;
              report.links[current] = await check(targets[current]);
            }
          });
          await Promise.all(workers);
          const api = 'https://data.ct.gov/resource/emyx-j53e.json?$limit=5000';
          try {
            const response = await fetch(api, {signal:AbortSignal.timeout(30000)});
            if (!response.ok) throw new Error('HTTP ' + response.status);
            const rows = await response.json();
            if (!Array.isArray(rows)) throw new Error('Expected Socrata JSON array');
            const milford = rows.filter(row => JSON.stringify(row).toLowerCase().includes('milford'));
            const expected = [
              ['Woodmont Borough', 0.5205],
              ['Laurel Beach', 3.34],
              ['Morningside', 0.0738],
              ['Bay View', 200],
              ['Point Beach', 300]
            ];
            const checks = expected.map(([name, value]) => {
              const hits = milford.filter(row => Object.values(row).some(v =>
                typeof v === 'string' && v.toLowerCase().includes(name.toLowerCase())));
              const numericFields = hits.flatMap(row => Object.entries(row).filter(([key, v]) =>
                /mill|rate|fee|amount/i.test(key) && v !== null && v !== '' && Number.isFinite(Number(v))));
              const candidateMatch = numericFields.some(([, v]) => Math.abs(Number(v) - value) < 0.000001);
              return {district:name, previouslyVerifiedValue:value, candidateRows:hits.length,
                numericCandidateMatch:candidateMatch, result:candidateMatch && hits.length === 1
                  ? 'CANDIDATE_MATCH_REQUIRES_HUMAN_SOURCE_REVIEW' : 'REVIEW_SOURCE_SCHEMA_OR_CHANGE'};
            });
            report.taxData = {source:api, status:'READ_ONLY_CANDIDATE_COMPARISON', rows:rows.length,
              milfordRows:milford.length, checks,
              caution:'A matching number is not independently verified applicability, fee type or effective date.'};
          } catch (error) {
            report.taxData = {source:api, status:'INCONCLUSIVE', error:String(error.message).slice(0,180)};
          }
          const suspicious = report.links.filter(item => item.result === 'REVIEW_POSSIBLE_DEAD_LINK');
          const inconclusive = report.links.filter(item => item.result === 'INCONCLUSIVE');
          const taxFlags = report.taxData.checks?.filter(item => item.result.startsWith('REVIEW_')) || [];
          mkdirSync('artifacts/milford-source-watch', {recursive:true});
          writeFileSync('artifacts/milford-source-watch/report.json', JSON.stringify(report, null, 2) + '\n');
          const summary = [
            '# Milford source watch (' + now + ')',
            '',
            'Read-only detection, NOT automatic fact verification or publication.',
            '',
            '- Source URLs checked: ' + targets.length,
            '- Reachable (not fact-verified): ' + report.links.filter(item => item.result === 'REACHABLE_NOT_FACT_VERIFIED').length,
            '- Possible dead links requiring review: ' + suspicious.length,
            '- Inconclusive responses (including anti-bot blocks): ' + inconclusive.length,
            '- Tax-data candidate rows: ' + (report.taxData.milfordRows ?? 'unavailable'),
            '- Tax comparisons requiring review: ' + taxFlags.length,
            '',
            '## Source responses requiring attention',
            ...[...suspicious, ...inconclusive].map(item => '- ' + item.result + ' (' + (item.status ?? 'no response') + '): ' + item.url),
            '',
            '## Tax-data comparison',
            ...(report.taxData.checks || []).map(item => '- ' + item.district + ': ' + item.result + ' (previously verified ' + item.previouslyVerifiedValue + ')'),
            '',
            'A reachable link does not prove that its contents, opening hours, tax values or fees remain accurate.',
            'Never update either language or publish a tax value from this report without independent primary-source verification.'
          ].join('\n');
          writeFileSync('artifacts/milford-source-watch/summary.md', summary + '\n');
          console.log(summary);
          if (suspicious.length || taxFlags.length) console.log('::warning::Milford source watch found items requiring verification; no website data changed.');
          NODE
      - name: Preserve dated evidence for certification review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milford-source-watch
          path: artifacts/milford-source-watch/
          if-no-files-found: warn
          retention-days: 30
