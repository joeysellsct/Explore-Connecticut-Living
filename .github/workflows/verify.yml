name: Verify town content

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  content-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run content regression tests
        run: node --test tests/*.test.mjs
