name: Verify town content

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  content-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run content regression tests
        run: node --test tests/*.test.mjs

  production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Next.js for Cloudflare Workers
        run: npm run build:worker
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SUPABASE_URL: https://rhjihnpplgeccowimqxj.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

  staging-smoke:
    # Formal town certification requires staging checks to pass, not merely run.
    # Keep this job independent of source/build checks, but fail the workflow if
    # staging is unavailable or bilingual content, disclosures or links regress.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - name: Check staging DNS, bilingual pages and indexing safeguards
        shell: bash
        env:
          STAGING_ORIGIN: https://explore-connecticut-living-staging.joeysellsct.workers.dev
        run: |
          set -euo pipefail
          host="${STAGING_ORIGIN#https://}"
          echo "Checking DNS for $host"
          getent ahosts "$host" || { echo "::error::Staging DNS does not resolve from GitHub runner"; exit 1; }
          for path in /robots.txt /en/towns/milford /es/towns/milford; do
            echo "Checking $path"
            headers="$(mktemp)"
            body="$(mktemp)"
            code="$(curl --silent --show-error --location --retry 2 --retry-delay 3 --connect-timeout 10 --max-time 35 --dump-header "$headers" --output "$body" --write-out '%{http_code}' "$STAGING_ORIGIN$path")" || {
              echo "::error::Could not fetch $path from staging"; exit 1;
            }
            if [[ "$code" != "200" ]]; then
              echo "::error::Staging $path returned HTTP $code"; exit 1
            fi
            if [[ "$path" == "/robots.txt" ]]; then
              if ! grep -Eiq '^Disallow:[[:space:]]*/[[:space:]]*$' "$body"; then
                echo "::error::Staging robots.txt does not disallow all crawling"; exit 1
              fi
            else
              if ! grep -Eiq '^x-robots-tag:.*noindex' "$headers" && ! grep -Eiq '<meta[^>]+name=["\x27]robots["\x27][^>]+content=["\x27][^"\x27]*noindex' "$body"; then
                echo "::error::Missing noindex protection on $path"; exit 1
              fi
              if ! grep -Eiq '<html[^>]+lang=["\x27](en|es)' "$body"; then
                echo "::error::Missing document language on $path"; exit 1
              fi
            fi
            echo "PASS $path"
            rm -f "$headers" "$body"
          done
      - name: Audit rendered Milford bilingual metadata, disclosures and deployment freshness
        run: node scripts/staging-town-audit.mjs
        env:
          STAGING_ORIGIN: https://explore-connecticut-living-staging.joeysellsct.workers.dev
      - name: Audit West Haven bilingual town pages without claiming certification
        run: node scripts/staging-town-audit.mjs
        env:
          AUDIT_TOWN: west-haven
          STAGING_ORIGIN: https://explore-connecticut-living-staging.joeysellsct.workers.dev

      - name: Capture Cloudflare runtime deployment evidence
        # Record what staging actually serves, without confusing Worker version
        # metadata with a Git SHA or failing unrelated content verification.
        if: always()
        env:
          STAGING_ORIGIN: https://explore-connecticut-living-staging.joeysellsct.workers.dev
          SOURCE_SHA: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p artifacts/cloudflare-provenance
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          const endpoint = process.env.STAGING_ORIGIN + '/api/deployment';
          const report = {
            checkedAt: new Date().toISOString(),
            sourceCommitCheckedOut: process.env.SOURCE_SHA,
            githubWorkflowRunId: process.env.WORKFLOW_RUN_ID,
            endpoint,
            evidenceLevel: 'RUNTIME_VERSION_ONLY_NOT_GIT_COMMIT_ATTESTATION',
            status: 'INCONCLUSIVE',
          };
          try {
            const response = await fetch(endpoint, {
              redirect: 'error',
              headers: {'cache-control': 'no-cache'},
              signal: AbortSignal.timeout(20000),
            });
            report.httpStatus = response.status;
            report.cacheControl = response.headers.get('cache-control');
            const payload = await response.json();
            if (response.status === 200 && payload.status === 'available' &&
                typeof payload.workerVersionId === 'string' && payload.workerVersionId) {
              report.status = 'WORKER_VERSION_OBSERVED';
              report.workerVersionId = payload.workerVersionId;
              report.workerVersionTag = payload.workerVersionTag ?? null;
              report.workerVersionCreatedAt = payload.workerVersionCreatedAt ?? null;
            } else {
              report.reason = String(payload.reason || 'Version metadata absent or unexpected response').slice(0, 200);
            }
          } catch (error) {
            report.reason = String(error.message).slice(0, 200);
          }
          report.gitCommitProvenanceVerified = false;
          report.nextStep = 'Match observed Worker version ID to independently accessed Cloudflare deployment records and their source commit SHA; compare with GitHub main.';
          writeFileSync('artifacts/cloudflare-provenance/runtime.json', JSON.stringify(report, null, 2) + '\n');
          const summary = 'Cloudflare runtime evidence: ' + report.status +
            (report.workerVersionId ? ' (Worker version ' + report.workerVersionId + ')' : '') +
            '. Git commit provenance remains unverified until Cloudflare deployment records are reconciled.';
          console.log(summary);
          if (report.status !== 'WORKER_VERSION_OBSERVED') console.log('::warning::' + (report.reason || 'Deployment endpoint unavailable'));
          NODE
      - name: Preserve Cloudflare deployment evidence for independent reconciliation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-runtime-provenance
          path: artifacts/cloudflare-provenance/
          if-no-files-found: warn
          retention-days: 30

  new-haven-browser-audit:
    # Browser failures must fail verification visibly; the hourly buildout can
    # still continue with other towns while a staging blocker is investigated.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser audit tools
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright @axe-core/playwright
          npx playwright install --with-deps chromium
      - name: Audit live Milford and West Haven EN/ES desktop and mobile rendering
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/milford-browser
          node scripts/staging-milford-browser-audit.mjs 2>&1 | tee artifacts/milford-browser/audit.log
        env:
          STAGING_ORIGIN: https://explore-connecticut-living-staging.joeysellsct.workers.dev
      - name: Save browser screenshots for manual visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-haven-browser-screenshots
          path: artifacts/milford-browser/
          if-no-files-found: ignore
          retention-days: 7
